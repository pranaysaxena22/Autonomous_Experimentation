# INGESTION FIXTURE (not a full setup): it describes how to read one real PUBLIC dataset so the data reader can be tested on it.
# Laboratory.csv: 1,005 batches, one row per batch, semicolon-separated, month-and-year dates in Slovenian (nov.18).
# Real third-party data, used only to test ingestion and models; never presented as client data. Source, DOI and licence: data/public/SOURCES.md
# The data file itself is not in git (data/public/ is git-ignored); this file only says how to read it.
context_factors:
- id: product_code
  label: Product code
  values: []
- id: strength
  label: Strength
  values: []
data:
  experiments_file: data/public/batch_production/Laboratory.csv
  delimiter: semicolon
  decimal: point
  id_columns:
    experiment: batch
    batch: batch
    date: start
  date:
    format: mon.yy
    language: sl
  column_map:
    code: product_code
    strength: strength
    size: batch_size
    api_water: api_water
    api_total_impurities: api_total_impurities
    api_l_impurity: api_l_impurity
    api_content: api_content
    tbl_min_weight: tbl_min_weight
    tbl_max_weight: tbl_max_weight
    tbl_av_hardness: tbl_av_hardness
    tbl_tensile: tbl_tensile
    dissolution_av: dissolution_av
    dissolution_min: dissolution_min
    batch_yield: batch_yield
    resodual_solvent: residual_solvent
    impurities_total: impurities_total
    impurity_o: impurity_o
    impurity_l: impurity_l
  provenance:
    data_status: real
    label: 'REAL PUBLIC DATA, NOT CLIENT DATA: tablet production batches (Zagar and Mihelic, Scientific Data 9:99, 2022; CC BY 4.0). Used only
      to test ingestion and models.'
    source: data/public/SOURCES.md (DOI 10.6084/m9.figshare.c.5645578)
    contains_real_client_data: false
