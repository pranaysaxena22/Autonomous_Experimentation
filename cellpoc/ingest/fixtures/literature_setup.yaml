    parteck: parteck_mg
    Polyethylene Glycol: polyethylene_glycol_mg
    Eudragit EPO: eudragit_epo_mg
    Precirol: precirol_mg
    acesulfame potassium: acesulfame_potassium_mg
    Polacrilin Potassium: polacrilin_potassium_mg
    Acryflow-L: acryflow_l_mg
    Indion: indion_mg
    Lubritose: lubritose_mg
    Sucralose: sucralose_mg
    Silicon dioxide: silicon_dioxide_mg
    Neotame: neotame_mg
    Sucrose: sucrose_mg
    Ocimum sanctum seed powder: ocimum_sanctum_seed_powder_mg
    Agar: agar_mg
    Calcium carbonate: calcium_carbonate_mg
    Sodium Saccharine: sodium_saccharine_mg
    Prosolv ODT: prosolv_odt_mg
