    water_absorption_pct: '%'
    disintegration_time_s: s
    wetting_time_s: s
  assumed_units:
  - id: sodium_saccharine_mg
    why: unit assumed, not confirmed by the dataset's dictionary
  composition:
    total_weight: tablet_weight_mg
    amount_suffix: _mg
    tolerance_pct: 2
  hardness:
    value_column: HARDNESS
    unit: kg/cm2
    to: hardness_kp
    conversions:
      kg/cm2:
        divide_by: 1
        status: assumed
        note: the dataset's dictionary gives hardness in kg/cm2; taken as kilopond (a kilogram of force), a common convention but not exact
      kP:
        divide_by: 1
  provenance:
    data_status: real
    label: 'REAL PUBLIC DATA, NOT CLIENT DATA: fast-disintegrating tablet formulations from published articles (Momeni, Harvard Dataverse; CC0).
      Used only to test ingestion and models.'
    source: data/public/SOURCES.md (DOI 10.7910/DVN/TUSJYB)
    contains_real_client_data: false
