# INGESTION FIXTURE (not a full setup): it describes how to read one real PUBLIC dataset so the data reader can be tested on it.
# final Data All Exipients.csv: 1,982 formulations from published articles; amounts are in mg, hardness is in kg/cm2; no ids, dates or batches.
# Real third-party data, used only to test ingestion and models; never presented as client data. Source, DOI and licence: data/public/SOURCES.md
# The data file itself is not in git (data/public/ is git-ignored); this file only says how to read it.
targets:
  constraints:
  - response: disintegration_time_s
    label: Disintegration time
    unit: s
    goal: at_most
    value: 60
    required: false
  objectives: []
data:
  experiments_file: data/public/formulation_literature/final Data All Exipients.csv
  delimiter: comma
  decimal: point
  id_columns: {}
  column_map:
    DOSE: drug_mg
    Weight(mg): tablet_weight_mg
    Microcrystalline Cellulose: microcrystalline_cellulose_mg
    Mannitol: mannitol_mg
    Magnesium Stearate: magnesium_stearate_mg
