    Polyvinylpyrrolidone (Crospovidone): polyvinylpyrrolidone_crospovidone_mg
    Sodium starch glycolate: sodium_starch_glycolate_mg
    polyvinyl acetate: polyvinyl_acetate_mg
    Lactose: lactose_mg
    Colloidal silicon dioxide (Aerosil): colloidal_silicon_dioxide_aerosil_mg
