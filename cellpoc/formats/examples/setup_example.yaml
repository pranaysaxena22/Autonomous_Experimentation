# =====================================================================
#  SETUP FILE (proposed format, version 1) - ILLUSTRATIVE EXAMPLE
#  Everything a client fills in on the setup screens is saved as this one file.
#  All values here are illustrative placeholders, not real client data.
#  Naming rules: docs/naming.md.  Machine-readable rules: cellpoc/formats/schemas/setup.schema.json.
# =====================================================================
format_version: 1

project:
  name: "Illustrative tablet study"
  data_status: illustrative          # synthetic | illustrative | real | validated  (weakest to strongest)

display:
  banner: "Simulation with illustrative values"
  accent_colour: "#86BC25"
  font: "Open Sans"

batch_size_g: 20                     # illustrative: grams of powder blend made in each trial

# ---- What goes into the tablet. id = quantity + unit; unit says what the min and max are measured in
ingredients:
  - { id: drug_pct,         label: "Drug (active)", role: active,       unit: "%", min: 10,   max: 30 }
  - { id: binder_pct,       label: "Binder",        role: binder,       unit: "%", min: 2,    max: 6 }
  - { id: disintegrant_pct, label: "Disintegrant",  role: disintegrant, unit: "%", min: 1,    max: 8 }
  - { id: lubricant_pct,    label: "Lubricant",     role: lubricant,    unit: "%", min: 0.25, max: 2 }
  - { id: filler_pct,       label: "Filler",        role: balance,      unit: "%", min: 50,   max: 90 }   # balance = 100 minus all the others

# ---- Rules about the recipe itself (not about results)
recipe_rules:
  - { rule: sum_to,  total: 100, tolerance: 0.05, unit: "%", label: "Ingredients must add up to 100%" }
  - { rule: at_most, items: [binder_pct, disintegrant_pct], limit: 12, unit: "%", label: "Binder plus disintegrant at most 12%" }

# ---- Settings of the process that the engine may choose (besides the recipe)
process_factors:
  - { id: compression_force_kn, label: "Compression force", unit: kN,  min: 5, max: 20 }
  - { id: blend_time_min,       label: "Blend time",        unit: min, min: 5, max: 30 }

# ---- Things that vary but the engine does not choose; they are recorded and allowed for
context_factors:
  - { id: binder_supplier,        label: "Binder supplier",        values: [A, B, C] }
  - { id: filler_grade,           label: "Filler grade",           values: [MCC-101, MCC-102] }
  - { id: dissolution_instrument, label: "Dissolution instrument", values: [DT-1, DT-2] }

# ---- What "good" means.
#  constraints = limits a result must respect:   goal is at_least | at_most | between
#  objectives  = things to push as far as possible (after the constraints are met), in priority order:  goal is maximise | minimise
targets:
  constraints:
    - { response: dissolution_30min_pct, label: "Dissolution at 30 min", unit: "%",  goal: at_least, value: 85, margin_scale: 5 }
    - { response: hardness_kp,           label: "Hardness",              unit: kP,   goal: between,  low: 6, high: 10 }
    - { response: friability_pct,        label: "Friability",            unit: "%",  goal: at_most,  value: 1.0, required: false }
  objectives:
    - { quantity: friability_pct, label: "Friability", unit: "%", goal: minimise }
    - { quantity: drug_pct,       label: "Drug load",  unit: "%", goal: maximise }

# ---- The cell: its layout file and how long each step takes. A step's time is the total of its actions' durations.
equipment:
  layout_file: "cell_layout_example.json"     # relative to this file; no absolute paths, no ".."
  steps:
    - { name: dispense, label: "Dispense", time_min: 30, stations: [rack, balance, bottle_shelf] }
    - { name: mix,      label: "Mix",      time_min: 45, stations: [balance] }
    - { name: press,    label: "Press",    time_min: 30, stations: [balance, press, discard] }
    - { name: test,     label: "Test",     time_min: 75, stations: [press, gauge, friabilator, vessel] }
    - { name: clean,    label: "Clean",    time_min: 60, stations: [] }
  measurement_step: test
  phases: { act: [dispense, mix, press], sense: [test], reason_adapt_step: clean, reason_min: 30 }

calendar:
  start: "2026-10-09 18:00"
  duration_h: 120
  staffed_days: [Mon, Tue]
  staffed_from: "08:00"
  staffed_until: "18:00"

# ---- Faults. "where" names the step, the action type and (if it applies) the ingredient.
faults:
  purge_min: 60
  clean_after_skip: true
  recovery: { tap_shake_s: 120, max_retries: 1 }
  scripted:                          # happen on purpose, on the named trial
    - { trial: 8,  where: { step: dispense, action: pour, ingredient: binder_pct }, cause: "binder bottle jam", retry_succeeds: true }
    - { trial: 19, where: { step: dispense, action: pour, ingredient: binder_pct }, cause: "binder bottle jam", retry_succeeds: false }
  random:                            # may happen on any trial, by chance
    # chance_per_trial and retry_succeeds_chance are PROBABILITIES from 0 to 1 and are used ONLY for random faults.
    # Scripted faults ignore them: they use retry_succeeds (true or false) instead.
    - { where: { step: press, action: press }, cause: "press jam", chance_per_trial: 0.0, retry_succeeds_chance: 0.7 }

baseline:
  manual_trials_per_week: 9

comparison:
  campaigns: 40
  trials_per_campaign: 30

engine:
  initial_recipes: 6
  candidates_per_decision: 3000
  model: auto                        # auto = the best-validated model; or the name of one

virtual_lab:
  noise:                             # scatter (standard deviation, "sd") of each simulated instrument, in the quantity's own unit
    - { quantity: dissolution_30min_pct, sd: 2.0 }
    - { quantity: hardness_kp,           sd: 0.35 }

seeds:
  run: 2026

# ---- How to read the client's experiment table (used by data ingestion)
data:
  experiments_file: "experiments_example.csv"            # relative to this file
  meta_file: "experiments_example.meta.json"
  encoding: "utf-8"                  # a leading byte-order mark (BOM) is accepted
  line_endings: any                  # Windows (CRLF) and Unix (LF) endings are both accepted
  delimiter: auto                    # auto | comma | semicolon | tab: what separates the columns
  decimal: auto                      # auto | point | comma: 12.5 or 12,5
  missing_markers: ["NA"]            # text that means "no value" (an empty cell always does)
  date: { format: "yyyy-mm-dd", language: en }   # pieces yyyy yy mm dd mon month; e.g. "mon.yy" for nov.18
  id_columns: { experiment: experiment_id, replicate: replicate_no, batch: batch_id, date: date, status: status, failure_reason: failure_reason }
  column_map:                        # raw column in the client's file -> platform id
    drug_pct: drug_pct
    filler_pct: filler_pct
    binder_pct: binder_pct
    disintegrant_pct: disintegrant_pct
    lubricant_pct: lubricant_pct
    compression_force_kN: compression_force_kn
    blend_time_min: blend_time_min
    binder_supplier: binder_supplier
    filler_grade: filler_grade
    dissolution_instrument: dissolution_instrument
    dissolution_30min_pct: dissolution_30min_pct
    friability_pct: friability_pct
  hardness:                          # raw hardness arrives in mixed units and becomes hardness_kp
    value_column: hardness
    unit_column: hardness_unit
    to: hardness_kp
    conversions: { kP: { divide_by: 1 }, N: { divide_by: 9.807 } }     # newtons divided by 9.807 give kP
  below_detection:                   # a result reported as "<limit"
    note_column: friability_note
    marker: "<0.05"
    quantity: friability_pct
    limit: 0.05
    rule: use_limit_and_flag         # use_limit_and_flag | use_half_limit | treat_as_missing
  replicates:
    group_by: [experiment_id]
    rule: mean                       # mean | median | keep_all
    keep_individual_rows_for_noise_estimate: true
  missing_values:
    policy: skip_for_that_response   # skip_for_that_response | drop_row | fail
  failed_runs:
    status_column: status
    failed_value: failed
    policy: exclude_from_models_keep_in_failure_statistics     # exclude_from_models_keep_in_failure_statistics | exclude | keep
